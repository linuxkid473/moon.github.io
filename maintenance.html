<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Games — Emergency Maintenance</title>
<link rel="icon" href="resources/download.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #1a0000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,40,40,0.35), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,0,0,0.06) 0 40px, rgba(0,0,0,0.06) 40px 80px),
      #1a0000;
    animation: pulse-bg 2.5s ease-in-out infinite;
  }
  @keyframes pulse-bg {
    0%, 100% { background-color: #1a0000; }
    50% { background-color: #2a0000; }
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    border: 2px solid #ff3232;
    border-radius: 16px;
    padding: 40px 32px;
    background: rgba(0,0,0,0.55);
    box-shadow: 0 0 60px rgba(255,0,0,0.35), inset 0 0 30px rgba(255,0,0,0.08);
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #ff3232;
    border: 1px solid #ff3232;
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 20px;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { to { opacity: 0.25; } }
  h1 {
    font-size: 28px;
    margin: 0 0 12px;
    color: #ff5252;
    text-shadow: 0 0 18px rgba(255,50,50,0.6);
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #f2c9c9;
    margin: 0 0 8px;
  }
  .sub {
    font-size: 13px;
    color: #b98787;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">⚠ Emergency Maintenance</span>
    <h1>Moon Games is temporarily offline</h1>
    <p>We're performing urgent backend maintenance (migrating chat infrastructure).</p>
    <p>Games, chat, and comments are unavailable right now. We'll be back shortly.</p>
    <p class="sub">Sorry for the interruption — thanks for your patience.</p>
  </div>
</body>
</html>

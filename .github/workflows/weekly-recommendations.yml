name: Weekly game recommendations email

on:
  schedule:
    - cron: "0 12 * * 0"   # every Sunday 12:00 UTC (Sunday 23:00 in Sydney)
  workflow_dispatch:        # and a "Run workflow" button, to try it

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0 nodemailer@6.9.16
      - run: node scripts/weekly-recommendations.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

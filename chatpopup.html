<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link id="dynamic-favicon" rel="icon" href="resources/download.png">
<title class="p1">Home | Compass</title>
<meta name="application-name" content="Document1 - Word">
<meta name="apple-mobile-web-app-title" content="Document1 - Word">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
function applyBrandMode() {
    var mode = localStorage.getItem("brandMode") || "normal";
    var favicon = document.getElementById("dynamic-favicon");
    if (mode === "alt") {
        document.title = "Dashboard";
        favicon.href = "resources/canvas.png?v=1";
    } else {
        document.title = "Home | Compass";
        favicon.href = "resources/download.png?v=1";
    }
}
applyBrandMode();
</script>
<style>
  body{ background: var(--bg); }
</style>
</head>

<div class="toast" id="toast"></div>

</body>

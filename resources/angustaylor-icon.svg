<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a75"/>
      <stop offset="1" stop-color="#0a1a3c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <!-- legs -->
  <rect x="78" y="150" width="16" height="34" rx="3" fill="#1a1a2e"/>
  <rect x="106" y="150" width="16" height="34" rx="3" fill="#1a1a2e"/>

  <!-- suit -->
  <rect x="66" y="96" width="68" height="60" rx="6" fill="#1c3a75" stroke="#3d5da8" stroke-width="2"/>

  <!-- tie -->
  <polygon points="100,100 92,130 100,158 108,130" fill="#c8102e"/>

  <!-- head -->
  <circle cx="100" cy="76" r="30" fill="#f0c8a0"/>
  <path d="M70,76 a30,30 0 0 1 60,0 a40,20 0 0 0 -60,0 z" fill="#5b4636"/>

  <!-- glasses -->
  <rect x="76" y="72" width="18" height="12" rx="2" fill="none" stroke="#1a1a2e" stroke-width="3"/>
  <rect x="106" y="72" width="18" height="12" rx="2" fill="none" stroke="#1a1a2e" stroke-width="3"/>
  <line x1="94" y1="78" x2="106" y2="78" stroke="#1a1a2e" stroke-width="3"/>

  <!-- dollar coin badge -->
  <circle cx="148" cy="140" r="22" fill="#ffd23f" stroke="#8a6a00" stroke-width="2"/>
  <text x="148" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#8a6a00" text-anchor="middle">$</text>
</svg>

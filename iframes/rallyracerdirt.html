<html>
  <link id="dynamic-favicon" rel="icon" type="image/png" href="resources/download.png">
      <title class="p1">Home | Compass</title>

     <script>
function applyBrandMode() {
    const mode = localStorage.getItem("brandMode") || "normal";
    const favicon = document.getElementById("dynamic-favicon");

    if (mode === "alt") {
        document.title = "Dashboard";
        favicon.href = "resources/canvas.png?v=1";
    } else {
        document.title = "Home | Compass";
        favicon.href = "resources/download.png?v=1";
    }
}

// Run on page load
applyBrandMode();
</script>

  <style type="text/css">
        html {
            overflow: auto;
        }

        html,
        body,
        div,
        iframe {
            margin: 0px;
            padding: 0px;
            height: 100%;
            border: none;
        }

        /* The source page adds its own branded bottom bar ("TBG95") inside
           the game frame. We don't control that page, so it's cropped out
           here by overflow-hiding a wrapper and overhanging the iframe
           past its bottom edge by the bar's height. */
        .crop-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .crop-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 60px);
            border: none;
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
  <div class="crop-wrap">
    <iframe src="https://rallyracerdirt.github.io/game-RallyRacerDirt/rally-racer-dirt/" allowfullscreen frameborder="0"></iframe>
  </div>
</html>

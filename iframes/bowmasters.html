<html>
  <link id="dynamic-favicon" rel="icon" type="image/png" href="resources/download.png">
      <title class="p1">Home | Compass</title>

     <script>
function applyBrandMode() {
    const mode = localStorage.getItem("brandMode") || "normal";
    const favicon = document.getElementById("dynamic-favicon");

    if (mode === "alt") {
        document.title = "Dashboard";
        favicon.href = "resources/canvas.png?v=1";
    } else {
        document.title = "Home | Compass";
        favicon.href = "resources/download.png?v=1";
    }
}

// Run on page load
applyBrandMode();
</script>

  <style type="text/css">
        html {
            overflow: auto;
        }

        html,
        body,
        div,
        iframe {
            margin: 0px;
            padding: 0px;
            height: 100%;
            border: none;
        }

        iframe {
            display: block;
            width: 100%;
            border: none;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* This game only reliably starts rendering when its iframe is
           created directly inside a real click handler on our own page
           (fresh user-activation context propagates down correctly);
           an iframe just sitting in the markup from page-load doesn't
           get it reliably once nested inside our player modal's own
           iframe. So it's gated behind a same-origin tap-to-play button
           we fully control, instead of embedding the game immediately. */
        .tap-gate {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0d;
            cursor: pointer;
            border: none;
            width: 100%;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .tap-gate .inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .tap-gate .circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s ease, transform .2s ease;
        }
        .tap-gate:hover .circle {
            background: rgba(255,255,255,.2);
            transform: scale(1.05);
        }
        .tap-gate .circle svg {
            width: 30px;
            height: 30px;
            margin-left: 4px;
        }
        .tap-gate span {
            font-size: 15px;
            font-weight: 600;
            opacity: .85;
        }
        .tap-gate[hidden] {
            display: none;
        }
    </style>
  <button class="tap-gate" id="tapGate" type="button">
    <span class="inner">
      <span class="circle">
        <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span>Tap to play Bowmasters</span>
    </span>
  </button>
  <script>
    document.getElementById("tapGate").addEventListener("click", function startGame(){
      var gate = document.getElementById("tapGate");
      var iframe = document.createElement("iframe");
      iframe.src = "https://aaravr10.github.io/bowmasters/";
      iframe.width = "100%";
      iframe.height = "100%";
      iframe.allow = "autoplay; fullscreen; gamepad; clipboard-write";
      iframe.allowFullscreen = true;
      iframe.frameBorder = "0";
      gate.replaceWith(iframe);
    });
  </script>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link id="dynamic-favicon" rel="icon" href="resources/download.png">
<title class="p1">Home | Compass</title>
<meta name="application-name" content="Document1 - Word">
<meta name="apple-mobile-web-app-title" content="Document1 - Word">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="description" content="Blockyard — a live multiplayer arena shooter on Moon Games. One shared arena, real players, real time.">

<script>
function applyBrandMode() {
    var mode = localStorage.getItem("brandMode") || "normal";
    var favicon = document.getElementById("dynamic-favicon");
    if (mode === "alt") {
        document.title = "Dashboard";
        favicon.href = "resources/canvas.png?v=1";
    } else {
        document.title = "Home | Compass";
        favicon.href = "resources/download.png?v=1";
    }
}
applyBrandMode();
</script>
<style>
  html, body{ height: 100%; overflow: hidden; }
  .fps-page-nav{ position: relative; z-index: 20; }

  #fpsStage{
    position: fixed; inset: 0; top: 65px;
    background: #0b0b0f;
  }
  #fpsCanvas{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  #fpsStart{
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1c1c2e, #08080c 75%);
    z-index: 10;
  }
  .fps-start-card{ text-align: center; max-width: 420px; padding: var(--s-6); }
  .fps-start-card h1{ color: #fff; font-size: 32px; margin: 0 0 var(--s-2); letter-spacing: -.02em; }
  .fps-start-card p{ color: rgba(255,255,255,.6); font-size: 14px; margin: 0 0 var(--s-5); line-height: 1.6; }
  .fps-start-card .pill-btn{ padding: 12px 28px; font-size: 15px; }
  .fps-controls-hint{
    display: flex; justify-content: center; gap: var(--s-4); flex-wrap: wrap;
    margin-top: var(--s-5); font-size: 12px; color: rgba(255,255,255,.45);
  }
  .fps-controls-hint kbd{
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    border-radius: 5px; padding: 2px 6px; font-family: inherit; font-size: 11px; color: #fff;
  }

  #fpsHud{ position: absolute; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #fpsHud.active{ display: block; }
  .fps-crosshair{
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 18px; height: 18px;
  }
  .fps-crosshair::before, .fps-crosshair::after{
    content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,.8);
  }
  .fps-crosshair::before{ left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  .fps-crosshair::after{ top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  .fps-health{
    position: absolute; left: var(--s-5); bottom: var(--s-5);
    width: 200px;
  }
  .fps-health-label{ color: rgba(255,255,255,.7); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .fps-health-bar{ height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
  .fps-health-fill{ height: 100%; background: linear-gradient(90deg, #34c759, #30d158); transition: width .15s var(--ease), background .2s var(--ease); }
  .fps-health-fill.low{ background: linear-gradient(90deg, #ff3b30, #ff6b6b); }

  .fps-kills{
    position: absolute; right: var(--s-5); bottom: var(--s-5);
    color: #fff; font-size: 13px; font-weight: 700; text-align: right;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .fps-kills span{ font-weight: 400; color: rgba(255,255,255,.5); }

  .fps-feed{
    position: absolute; top: var(--s-4); right: var(--s-4);
    display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
    max-width: 260px;
  }
  .fps-feed-row{
    background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
    color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 6px;
    animation: fps-feed-in .2s var(--ease) both;
  }
  @keyframes fps-feed-in{ from{ opacity:0; transform: translateY(-6px); } to{ opacity:1; transform: translateY(0); } }
  .fps-feed-row .victim{ color: #ff8a8a; }
  .fps-feed-row .shooter{ color: #8ab4ff; }

  .fps-online{
    position: absolute; top: var(--s-4); left: var(--s-4);
    color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .fps-online .dot{ width: 7px; height: 7px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,.25); }

  .fps-respawn{
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6);
    color: #fff; font-size: 22px; font-weight: 700;
    flex-direction: column; gap: 8px;
  }
  .fps-respawn.show{ display: flex; }
  .fps-respawn span{ font-size: 13px; font-weight: 400; color: rgba(255,255,255,.6); }

  .fps-nametag{
    position: absolute; top: 0; left: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 5px; white-space: nowrap;
    pointer-events: none; will-change: transform;
  }

  .fps-exit-btn{
    position: absolute; top: var(--s-4); left: 50%; transform: translateX(-50%);
    pointer-events: auto;
    background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: var(--radius-pill); padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<header class="nav fps-page-nav">
  <div class="nav-inner">
    <a class="brand" href="index.html" aria-label="Moon Games home">
      <span class="brand-mark" aria-hidden="true"></span>
      Moon Games
    </a>
    <div class="nav-actions" style="margin-left:auto">
      <a class="icon-btn" id="leaderboardBtn" href="leaderboards.html" aria-label="Leaderboards" title="Leaderboards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a1 1 0 0 0-1 1c0 2.5 1.5 4 4 4.3M17 6h3a1 1 0 0 1 1 1c0 2.5-1.5 4-4 4.3"/></svg>
      </a>
      <button class="icon-btn" id="profileBtn" aria-label="Your profile" title="Your profile"></button>
      <a class="pill-btn" href="index.html">Back to games</a>
    </div>
  </div>
</header>

<div id="fpsStage">
  <canvas id="fpsCanvas"></canvas>

  <div id="fpsStart">
    <div class="fps-start-card">
      <h1>Blockyard</h1>
      <p>One shared arena. Everyone on Moon Games right now can be in here with you. Click to lock your mouse and jump in.</p>
      <button class="pill-btn primary" id="fpsPlayBtn">Click to play</button>
      <div class="fps-controls-hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
        <span><kbd>Space</kbd> jump</span>
        <span>Mouse look</span>
        <span>Click to shoot</span>
        <span><kbd>Esc</kbd> release mouse</span>
      </div>
    </div>
  </div>

  <div id="fpsHud">
    <button class="fps-exit-btn" id="fpsExitBtn">Exit arena</button>
    <div class="fps-online"><span class="dot"></span><span id="fpsOnlineCount">1 in the arena</span></div>
    <div class="fps-crosshair"></div>
    <div class="fps-health">
      <div class="fps-health-label">Health</div>
      <div class="fps-health-bar"><div class="fps-health-fill" id="fpsHealthFill" style="width:100%"></div></div>
    </div>
    <div class="fps-kills"><span>Kills</span> <span id="fpsKillCount">0</span></div>
    <div class="fps-feed" id="fpsFeed"></div>
    <div class="fps-respawn" id="fpsRespawn">
      Eliminated
      <span id="fpsRespawnTimer">Respawning in 3&hellip;</span>
    </div>
  </div>
</div>

<script src="chrome.js"></script>
<script type="module" src="identity.js"></script>
<script type="module" src="profile.js"></script>
<script type="module" src="chat.js"></script>
<script type="module" src="fps.js"></script>
</body>
</html>
